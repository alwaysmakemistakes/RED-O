apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: red-o-runtime-sockets
spec:
  kprobes:
    - call: security_file_open
      syscall: false
      args:
        - index: 0
          type: file
      selectors:
        - matchArgs:
            - index: 0
              operator: Prefix
              values:
                - /run/containerd/containerd.sock
                - /var/run/docker.sock
                - /run/docker.sock
                - /run/crio/crio.sock
