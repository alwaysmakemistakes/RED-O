apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: lab-file-access
spec:
  kprobes:
    - call: security_file_permission
      syscall: false
      args:
        - index: 0
          type: file
        - index: 1
          type: int
      selectors:
        - matchArgs:
            - index: 0
              operator: Prefix
              values:
                - /etc/hostname
                - /etc/passwd
                - /etc/shadow
                - /tmp/runtime-detector-
