apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: red-o-serviceaccount-token
spec:
  kprobes:
    - call: security_file_open
      syscall: false
      args:
        - index: 0
          type: file
      selectors:
        - matchArgs:
            - index: 0
              operator: Prefix
              values:
                - /run/secrets/kubernetes.io/serviceaccount/
                - /var/run/secrets/kubernetes.io/serviceaccount/
